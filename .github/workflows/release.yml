name: Auto publish for Maek AE2 Better
on:
  pull_request:
    branches:
    - 1.20.1
    paths-ignore:
      - 'README.md'
      - '.github/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup Java 17
        uses: actions/setup-java@v4.2.1
        with:
          distribution: zulu
          java-version: 17

      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: spotlessApply
        run: ./gradlew spotlessApply

      - name: RunData
        run: ./gradlew rundata

      - name: Build
        run: ./gradlew build

      - name: Read Properties
        id: 'properties'
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'mod_id mod_name'

      - name: Get Version
        id: var
        run: |
          MESSAGE=$(ls build/libs/* | grep sources.jar -v | grep shadow.jar -v | grep slim.jar -v | awk -F '${{ steps.properties.outputs.mod_id }}-|.jar' '{print $2}')
          echo version=$MESSAGE >> $GITHUB_OUTPUT

      - name: Release
        id: release
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          modrinth-id: hLXzdHJ2
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 1305823
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-tag: ${{ github.ref_name }}
          github-generate-changelog: true
          github-draft: false
          github-prerelease: false
          github-commitish: 1.20.1
          github-discussion: Announcements
          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar

          name: MakeAE2Better-${{ steps.var.outputs.version }}
          version: ${{ steps.var.outputs.version }}
          version-type: release

          loaders: |
            forge
            neoforge
          game-versions: |
           1.20.1
          game-version-filter: none
          java: 17
          fail-mode: fail
