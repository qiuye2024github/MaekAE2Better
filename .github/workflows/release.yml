name: Release with PR Notes

on:
  push:
    tags:
      - 'v*'  # 当推送以v开头的tag时触发发布
  workflow_dispatch:  # 允许手动触发
    inputs:
      tag:
        description: '要发布的Tag名称'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.tag || github.ref_name }}
      RELEASE_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout code with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整提交历史，用于比较tag

      - name: Setup Java 17
        uses: actions/setup-java@v4.2.1
        with:
          distribution: zulu
          java-version: 17

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: RunData
        run: ./gradlew rundata

      - name: Build
        run: ./gradlew build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: ./build/libs/!(*-@(dev|sources|javadoc)).jar

      - name: Read Properties
        id: properties
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'mod_id mod_name'

      - name: Get Version
        id: var
        run: |
          # 直接从 gradle.properties 文件中提取 mod_version
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "提取的版本号: $VERSION"

      - name: Get PR information since last release
        id: pr_info
        run: |
          # 获取最近的tag（上一个发布版本）
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$LATEST_TAG" ]; then
            # 如果没有找到tag，获取所有PR
            PR_QUERY="base:1.20.1 is:merged"
            echo "没有找到之前的tag，将包含所有已合并的PR"
          else
            # 获取上一个tag之后的提交
            PR_QUERY="base:1.20.1 is:merged merged:>$(git log -1 --format=%cd --date=short $LATEST_TAG)"
            echo "上一个tag: $LATEST_TAG"
          fi
          
          # 使用GitHub CLI获取PR列表
          PR_LIST=$(gh pr list --state merged --base 1.20.1 --limit 50 --json number,title,url,mergeCommit --jq '.[] | "• #\(.number) - \(.title) (\(.url))"')
          
          if [ -z "$PR_LIST" ]; then
            RELEASE_NOTES="## 发布说明 ## 本次发布包含常规更新和优化。"
          else
            RELEASE_NOTES="## 发布说明 ## 包含的PR更改:$PR_LIST"
          fi
          
          # 存储发布说明
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # 存储PR数量用于后续步骤
          PR_COUNT=$(echo "$PR_LIST" | wc -l)
          echo "pr_count=$PR_COUNT" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag }}
          release_name: MakeAE2Better-${{ steps.var.outputs.version }}
          body: |
            ${{ steps.pr_info.outputs.RELEASE_NOTES }}
            
            **构建信息:**
            - 版本: ${{ steps.var.outputs.version }}
            - Minecraft: 1.20.1
            - 加载器: Forge/NeoForge
          draft: false
          prerelease: false

#      - name: Download artifacts
#        uses: actions/download-artifact@v4
#        with:
#          name: jar
#          path: ./downloaded-jars

#      - name: Upload JAR to Release
#        uses: actions/upload-release-asset@v1
#        env:
#          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#        with:
#          upload_url: ${{ steps.create_release.outputs.upload_url }}
#          asset_path: ./downloaded-jars/*.jar
#          asset_name: makeae2better-${{ steps.var.outputs.version }}.jar
#          asset_content_type: application/java-archive

      - name: Publish to Mod Platforms
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          modrinth-id: hLXzdHJ2
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1305823
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar
          name: MakeAE2Better-${{ steps.var.outputs.version }}
          version: ${{ steps.var.outputs.version }}
          version-type: release
          loaders: |
            forge
            neoforge
          game-versions: |
            1.20.1
          game-version-filter: none
          java: 17
          fail-mode: fail